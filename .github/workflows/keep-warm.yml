name: Keep Render backend warm

# Render's free tier spins the service down after ~15 minutes of no
# requests, causing a slow (~30s) response for whoever visits next.
# This pings the health endpoint every 10 minutes to keep it awake.
# Delete this workflow once you're on a paid Render plan (always-on)
# — it becomes unnecessary and just wastes GitHub Actions minutes.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf https://REPLACE-WITH-YOUR-RENDER-URL.onrender.com/api/health || echo "Ping failed (service may be cold-starting)"
